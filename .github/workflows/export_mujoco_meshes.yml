name: Export MuJoCo Mesh Assets

# Run manually from the Actions tab whenever you need fresh mesh assets.
# Downloads a zip of all .stl / .obj / .png files for aic_utils/aic_mujoco/mjcf/.

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  export-meshes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ── Disk space ────────────────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          df -h

      # ── Pull eval image ───────────────────────────────────────────────────
      - name: Pull aic_eval Docker image
        run: docker pull ghcr.io/intrinsic-dev/aic/aic_eval:latest

      # ── Start Gazebo (headless, no GUI, no engine) ────────────────────────
      - name: Start Gazebo
        run: |
          docker run -d --name aic_eval \
            ghcr.io/intrinsic-dev/aic/aic_eval:latest \
            "spawn_task_board:=true" \
            "nic_card_mount_0_present:=true" \
            "spawn_cable:=true" \
            "cable_type:=sfp_sc_cable" \
            "attach_cable_to_gripper:=true" \
            "ground_truth:=true" \
            "start_aic_engine:=false" \
            "launch_rviz:=false" \
            "gazebo_gui:=false"

      # ── Install sdformat_mjcf inside the container ────────────────────────
      - name: Install sdformat_mjcf in container
        run: |
          git clone --depth 1 -b aic \
            https://github.com/gazebosim/gz-mujoco.git /tmp/gz-mujoco
          docker cp /tmp/gz-mujoco/sdformat_mjcf aic_eval:/tmp/sdformat_mjcf

          # Refresh apt lists and install sdformat C++ runtime + Python bindings
          docker exec aic_eval bash -c "apt-get update -q && apt-get install -y libsdformat16 python3-sdformat16 python3-gz-math9"
          docker exec aic_eval python3 -c "import sdformat; print('sdformat OK:', sdformat.__file__)"

          # The aic branch setup.py requires __version__.py — create it so install succeeds
          docker exec aic_eval bash -c \
            "echo '__version__ = \"0.0.1\"' > /tmp/sdformat_mjcf/src/sdformat_mjcf/__version__.py"

          # Install via setup.py so the sdf2mjcf entry-point script gets created
          docker exec aic_eval bash -c \
            "cd /tmp/sdformat_mjcf && python3 setup.py install 2>&1 | tail -10"

          # The aic branch source has mesh_io.py (.glb→.obj) and updated utils that
          # setup.py does not install (it picks up an older egg). Overwrite in-place.
          docker exec aic_eval bash -c "
            SRC=/tmp/sdformat_mjcf/src/sdformat_mjcf
            DST=\$(python3 -c 'import sdformat_mjcf; import os; print(os.path.dirname(sdformat_mjcf.__file__))')
            cp -r \$SRC/sdformat_to_mjcf/mesh_io.py        \$DST/sdformat_to_mjcf/
            cp -r \$SRC/sdformat_to_mjcf/converters/        \$DST/sdformat_to_mjcf/
            cp -r \$SRC/sdformat_to_mjcf/sdformat_to_mjcf.py \$DST/sdformat_to_mjcf/
            cp -r \$SRC/sdformat_to_mjcf/sdf_kinematics.py   \$DST/sdformat_to_mjcf/
            cp -r \$SRC/utils/                               \$DST/
          "

          # The aic branch still references sdformat13 and gz.math7 by old names.
          # The container ships these as 'sdformat' and 'gz.math' — patch all .py files.
          docker exec aic_eval bash -c "
            DST=\$(python3 -c 'import sdformat_mjcf; import os; print(os.path.dirname(sdformat_mjcf.__file__))')
            find \$DST -name '*.py' | xargs sed -i \
              's/from sdformat13 /from sdformat /g
               s/import sdformat13/import sdformat/g
               s/gz\.math7/gz.math/g
               s/gz\.math8/gz.math/g
               s/gz\.math9/gz.math/g'
            find \$DST -name '*.pyc' -delete
          "

          # Verify install succeeded and sdf2mjcf CLI is on PATH
          docker exec aic_eval python3 -c "import sdformat_mjcf; print('sdformat_mjcf OK')"
          docker exec aic_eval which sdf2mjcf

      # ── SDF parser script ─────────────────────────────────────────────────
      - name: Copy SDF parser script into container
        run: docker cp .github/scripts/parse_sdf.py aic_eval:/tmp/parse_sdf.py

      # ── Wait for the world to finish loading ──────────────────────────────
      - name: Wait for Gazebo world to load
        run: |
          echo "Sleeping 120s for Gazebo to fully load on x86..."
          sleep 120
          echo "--- Last 30 lines of container log ---"
          docker logs aic_eval 2>&1 | tail -30

      # ── Find SDF file Gazebo was started with ────────────────────────────────
      - name: Export world SDF from Gazebo
        run: |
          SDF_PATH=$(docker exec aic_eval bash -c "ps aux | grep -o '[^ ]*\.sdf' | grep -v grep | head -1")
          echo "Gazebo SDF path: $SDF_PATH"
          docker exec aic_eval ls -lh "$SDF_PATH"
          docker cp "aic_eval:$SDF_PATH" /tmp/aic.sdf
          head -c 300 /tmp/aic.sdf
          head -c 1 /tmp/aic.sdf | grep -q '<' || (echo "ERROR: SDF does not start with XML" && exit 1)
          echo "SDF OK — $(wc -c < /tmp/aic.sdf) bytes"
          docker cp /tmp/aic.sdf aic_eval:/tmp/aic.sdf

      # ── Fix known SDF URI issues ──────────────────────────────────────────
      - name: Fix SDF URI issues
        run: |
          docker exec aic_eval bash -c \
            "sed -i 's|file://<urdf-string>/model://|file:///|g' /tmp/aic.sdf && \
             ASSETS=/ws_aic/install/share/aic_assets/models && \
             sed -i \"s|file:///sc_plug_visual|file://\${ASSETS}/SC Plug/sc_plug_visual|g\" /tmp/aic.sdf && \
             sed -i \"s|file:///lc_plug_visual|file://\${ASSETS}/LC Plug/lc_plug_visual|g\" /tmp/aic.sdf && \
             sed -i \"s|file:///sfp_module_visual|file://\${ASSETS}/SFP Module/sfp_module_visual|g\" /tmp/aic.sdf && \
             sed -i 's|<uri>file://\([^<]*\)</uri>|<uri>\1</uri>|g' /tmp/aic.sdf"

      # ── Convert SDF → MJCF + mesh assets ─────────────────────────────────
      - name: Convert SDF to MJCF
        run: |
          docker exec aic_eval bash -c \
            "mkdir -p /tmp/aic_mujoco_world && \
             source /opt/ros/kilted/setup.bash && \
             source /ws_aic/install/setup.bash && \
             PATH=/usr/local/bin:\$PATH sdf2mjcf /tmp/aic.sdf /tmp/aic_mujoco_world/aic_world.xml"
          docker exec aic_eval bash -c \
            "echo 'Files generated:' && \
             ls /tmp/aic_mujoco_world/ | wc -l && \
             ls /tmp/aic_mujoco_world/ | head -20"

      # ── Package and upload ────────────────────────────────────────────────
      - name: Package mesh assets
        run: |
          docker cp aic_eval:/tmp/aic_mujoco_world /tmp/aic_mujoco_world
          cd /tmp/aic_mujoco_world
          zip -r /tmp/mujoco_mesh_assets.zip . --exclude '*.xml'
          ls -lh /tmp/mujoco_mesh_assets.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mujoco-mesh-assets
          path: /tmp/mujoco_mesh_assets.zip
          retention-days: 30
