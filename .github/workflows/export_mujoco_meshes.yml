name: Export MuJoCo Mesh Assets

# Run manually from the Actions tab whenever you need fresh mesh assets.
# Downloads a zip of all .stl / .obj / .png files for aic_utils/aic_mujoco/mjcf/.

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  export-meshes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ── Disk space ────────────────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          df -h

      # ── Pull eval image ───────────────────────────────────────────────────
      - name: Pull aic_eval Docker image
        run: docker pull ghcr.io/intrinsic-dev/aic/aic_eval:latest

      # ── Start Gazebo (headless, no GUI, no engine) ────────────────────────
      - name: Start Gazebo
        run: |
          docker run -d --name aic_eval \
            ghcr.io/intrinsic-dev/aic/aic_eval:latest \
            "spawn_task_board:=true" \
            "nic_card_mount_0_present:=true" \
            "spawn_cable:=true" \
            "cable_type:=sfp_sc_cable" \
            "attach_cable_to_gripper:=true" \
            "ground_truth:=true" \
            "start_aic_engine:=false" \
            "launch_rviz:=false" \
            "gazebo_gui:=false"

      # ── Install sdformat_mjcf inside the container ────────────────────────
      - name: Install sdformat_mjcf in container
        run: |
          git clone --depth 1 -b aic \
            https://github.com/gazebosim/gz-mujoco.git /tmp/gz-mujoco
          docker cp /tmp/gz-mujoco/sdformat_mjcf aic_eval:/tmp/sdformat_mjcf

          # Ensure python3-sdformat16 apt package is present (needed by sdformat_mjcf)
          docker exec aic_eval bash -c "apt-get install -y python3-sdformat16 python3-gz-math9 2>/dev/null || true"

          # Bootstrap pip and install the package
          docker exec aic_eval bash -c \
            "python3 -m ensurepip --upgrade 2>/dev/null || true && \
             python3 -m pip install /tmp/sdformat_mjcf --break-system-packages"

          # Verify import works
          docker exec aic_eval python3 -c "import sdformat_mjcf; print('sdformat_mjcf OK')"

      # ── SDF parser script ─────────────────────────────────────────────────
      # Written to host first (no indentation issues), then copied in.
      - name: Write and copy SDF parser script
        run: |
          cat > /tmp/parse_sdf.py << 'PYEOF'
import sys, re
data = sys.stdin.read()
# gz service returns: data: "<?xml ...>"  (proto text format)
m = re.search(r'data:\s*"(.*)', data, re.DOTALL)
if m:
    sdf = m.group(1).encode().decode('unicode_escape').rstrip('"')
    open('/tmp/aic.sdf', 'w').write(sdf)
    print('SDF written, bytes:', len(sdf))
else:
    open('/tmp/aic.sdf', 'w').write(data)
    print('Fallback write, bytes:', len(data))
PYEOF
          docker cp /tmp/parse_sdf.py aic_eval:/tmp/parse_sdf.py

      # ── Wait for the world to finish loading ──────────────────────────────
      - name: Wait for Gazebo world to load
        run: |
          echo "Watching container logs for Gazebo ready signal..."
          timeout 180 bash -c "
            until docker logs aic_eval 2>&1 | \
              grep -q 'Loaded world\|gz-server.*running\|Gazebo is running\|spawn_task_board'; do
              sleep 5
              echo 'still waiting...'
            done
          "
          echo "Gazebo ready — sleeping 20s for full world init"
          sleep 20

      # ── Export SDF via gz service ─────────────────────────────────────────
      - name: Export world SDF from Gazebo
        run: |
          docker exec aic_eval bash -c \
            "source /opt/ros/kilted/setup.bash && \
             source /ws_aic/install/setup.bash && \
             gz service \
               -s /world/aic/generate_world_sdf \
               --reqtype gz.msgs.WorldGeneratorParams \
               --reptype gz.msgs.StringMsg \
               --timeout 30000 \
               --req '{save_fuel_world: false}' \
             | python3 /tmp/parse_sdf.py"
          docker exec aic_eval ls -lh /tmp/aic.sdf

      # ── Fix known SDF URI issues ──────────────────────────────────────────
      - name: Fix SDF URI issues
        run: |
          docker exec aic_eval bash -c \
            "sed -i 's|file://<urdf-string>/model://|file:///|g' /tmp/aic.sdf && \
             ASSETS=/ws_aic/install/share/aic_assets/models && \
             sed -i \"s|file:///sc_plug_visual|file://\${ASSETS}/SC Plug/sc_plug_visual|g\" /tmp/aic.sdf && \
             sed -i \"s|file:///lc_plug_visual|file://\${ASSETS}/LC Plug/lc_plug_visual|g\" /tmp/aic.sdf && \
             sed -i \"s|file:///sfp_module_visual|file://\${ASSETS}/SFP Module/sfp_module_visual|g\" /tmp/aic.sdf"

      # ── Convert SDF → MJCF + mesh assets ─────────────────────────────────
      - name: Convert SDF to MJCF
        run: |
          docker exec aic_eval bash -c \
            "mkdir -p /tmp/aic_mujoco_world && \
             source /ws_aic/install/setup.bash && \
             python3 -m sdformat_mjcf /tmp/aic.sdf /tmp/aic_mujoco_world/aic_world.xml 2>/dev/null || \
             sdf2mjcf /tmp/aic.sdf /tmp/aic_mujoco_world/aic_world.xml"
          docker exec aic_eval bash -c \
            "echo 'Files generated:' && \
             ls /tmp/aic_mujoco_world/ | wc -l && \
             ls /tmp/aic_mujoco_world/ | head -20"

      # ── Package and upload ────────────────────────────────────────────────
      - name: Package mesh assets
        run: |
          docker cp aic_eval:/tmp/aic_mujoco_world /tmp/aic_mujoco_world
          cd /tmp/aic_mujoco_world
          zip -r /tmp/mujoco_mesh_assets.zip . --exclude '*.xml'
          ls -lh /tmp/mujoco_mesh_assets.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mujoco-mesh-assets
          path: /tmp/mujoco_mesh_assets.zip
          retention-days: 30
